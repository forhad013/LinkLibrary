<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Save - LinkLibrary</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #ffffff;
    }

    h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a1a1a;
    }

    .link-info {
      margin: 12px 0;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }

    .title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
      color: #1a1a1a;
      word-break: break-word;
    }

    .url {
      font-size: 12px;
      color: #666;
      word-break: break-all;
      line-height: 1.4;
    }

    .options {
      margin: 12px 0;
    }

    .option-group {
      margin-bottom: 8px;
    }

    .option-group label {
      font-size: 12px;
      color: #666;
      display: block;
      margin-bottom: 4px;
    }

    .option-group input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 12px;
      color: #1a1a1a;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #6200EE;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background: #5200CD;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .success {
      color: #4CAF50;
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      padding: 8px;
      background: #e8f5e9;
      border-radius: 4px;
    }

    .error {
      color: #f44336;
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      padding: 8px;
      background: #ffebee;
      border-radius: 4px;
    }

    .loading {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 12px;
    }

    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
      text-align: center;
    }

    .footer a {
      color: #6200EE;
      text-decoration: none;
      font-size: 12px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .link-count {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>📚 Save to LinkLibrary</h2>

  <div class="link-info">
    <div class="title" id="page-title">Loading...</div>
    <div class="url" id="page-url">Loading...</div>
  </div>

  <div class="options">
    <div class="option-group">
      <label for="description">Description (optional):</label>
      <input type="text" id="description" placeholder="Add a note...">
    </div>

    <div class="option-group">
      <div class="checkbox-group">
        <input type="checkbox" id="is-favorite">
        <label for="is-favorite">Add to favorites</label>
      </div>
    </div>
  </div>

  <button id="save-btn">Save Link</button>
  <button id="open-app-btn" style="background: #4CAF50;">Open LinkLibrary App</button>

  <div id="status"></div>
  <div id="link-count" class="link-count"></div>

  <div class="footer">
    <a href="https://linklibrary.app" target="_blank">Open LinkLibrary Web App →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
