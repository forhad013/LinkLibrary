<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;

        }

<body class="bg-background text-on-surface antialiased flex min-h-screen">
<!-- Navigations Suppressed for Task-Focused Form (Add Collection) -->
<main class="flex-1 flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Ambient Background -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-primary-container/30 blur-[100px]"></div>
<div class="absolute top-[60%] -right-[10%] w-[40vw] h-[40vw] rounded-full bg-secondary-container/20 blur-[80px]"></div>
</div>
<div class="w-full max-w-2xl z-10 relative">
<!-- Header -->
<div class="mb-gutter md:mb-section-gap flex items-center justify-between">
<div>
<button class="mb-4 text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2 font-label-lg text-label-lg group">
<span class="material-symbols-outlined text-[20px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                        Back to Collections
                    </button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">New Collection</h1>
</div>
</div>
<!-- Form Card -->
<div class="bg-surface rounded-[24px] p-container-padding shadow-lg shadow-primary/5 flex flex-col gap-8 relative overflow-hidden">
<!-- Decorative Top Edge -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>
<form class="flex flex-col gap-6">
<!-- Collection Name -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="collectionName">Collection Name</label>
<input class="w-full bg-surface-container-low border-2 border-transparent focus:border-secondary focus:bg-surface focus:ring-0 rounded-xl px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder-outline transition-all" id="collectionName" placeholder="e.g. Q3 Marketing Assets" type="text"/>
</div>
<!-- Icon Selection -->
<div class="flex flex-col gap-3">
<label class="font-label-lg text-label-lg text-on-surface-variant">Choose an Icon</label>
<div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-3 max-h-[160px] overflow-y-auto custom-scrollbar p-1">
<label class="cursor-pointer group relative aspect-square">
<input checked="" class="peer sr-only" name="collectionIcon" type="radio"/>
<div class="w-full h-full rounded-xl flex items-center justify-center bg-surface-container-low text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:shadow-md transition-all group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-2xl">folder</span>
</div>
</label>
<label class="cursor-pointer group relative aspect-square">
<input class="peer sr-only" name="collectionIcon" type="radio"/>
<div class="w-full h-full rounded-xl flex items-center justify-center bg-surface-container-low text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:shadow-md transition-all group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-2xl">palette</span>
</div>
</label>
<label class="cursor-pointer group relative aspect-square">
<input class="peer sr-only" name="collectionIcon" type="radio"/>
<div class="w-full h-full rounded-xl flex items-center justify-center bg-surface-container-low text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:shadow-md transition-all group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-2xl">code</span>
</div>
</label>
<label class="cursor-pointer group relative aspect-square">
<input class="peer sr-only" name="collectionIcon" type="radio"/>
<div class="w-full h-full rounded-xl flex items-center justify-center bg-surface-container-low text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:shadow-md transition-all group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-2xl">monitoring</span>
</div>
</label>
<label class="cursor-pointer group relative aspect-square">
<input class="peer sr-only" name="collectionIcon" type="radio"/>
<div class="w-full h-full rounded-xl flex items-center justify-center bg-surface-container-low text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:shadow-md transition-all group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-2xl">description</span>
</div>
</label>
<label class="cursor-pointer group relative aspect-square">
<input class="peer sr-only" name="collectionIcon" type="radio"/>
<div class="w-full h-full rounded-xl flex items-center justify-center bg-surface-container-low text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:shadow-md transition-all group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-2xl">science</span>
</div>
</label>
<label class="cursor-pointer group relative aspect-square">
<input class="peer sr-only" name="collectionIcon" type="radio"/>
<div class="w-full h-full rounded-xl flex items-center justify-center bg-surface-container-low text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:shadow-md transition-all group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-2xl">campaign</span>
</div>
</label>
<label class="cursor-pointer group relative aspect-square">
<input class="peer sr-only" name="collectionIcon" type="radio"/>
<div class="w-full h-full rounded-xl flex items-center justify-center bg-surface-container-low text-on-surface-variant peer-checked:bg-primary peer-checked:text-on-primary peer-checked:shadow-md transition-all group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-2xl">auto_awesome</span>
</div>
</label>
</div>
</div>
<!-- Parent Collection (Hierarchy) -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface-variant flex justify-between items-center" for="parentCollection">
<span>Parent Collection <span class="text-outline font-normal">(Optional)</span></span>
</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border-2 border-transparent focus:border-secondary focus:bg-surface focus:ring-0 rounded-xl px-4 py-3 pr-10 font-body-lg text-body-lg text-on-surface transition-all" id="parentCollection">
<option selected="" value="">None (Root Level)</option>
<option value="1">Marketing Assets</option>
<option value="2">Product Specs</option>
<option value="3">Design System</option>
<option value="4">User Research</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<p class="font-body-md text-body-md text-outline mt-1">Nest this collection under an existing one to keep things organized.</p>
</div>
<!-- Actions -->
<div class="pt-6 mt-2 flex flex-col sm:flex-row justify-end gap-3 border-t border-surface-variant">
<button class="px-6 py-2.5 rounded-full font-label-lg text-label-lg text-primary hover:bg-surface-variant/50 transition-colors" type="button">
                            Cancel
                        </button>
<button class="px-6 py-2.5 rounded-full font-label-lg text-label-lg bg-primary text-on-primary hover:bg-surface-tint shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
                            Create Collection
                        </button>
</div>
</form>
</div>
</div>
</main>
</body></html>
