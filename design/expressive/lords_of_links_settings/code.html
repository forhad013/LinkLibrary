<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings - Lords of Links</title>

                    "borderRadius": {

                    },
                    "spacing": {
                        "base": "8px",
                        "margin-desktop": "24px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "section-gap": "48px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],

                    "fontSize": {

                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],

                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }]

<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-[80px]">
<!-- TopAppBar (Settings focus, suppressing FAB and active nav isn't primary here, but keeping TopAppBar for branding) -->
<header class="bg-background dark:bg-background w-full sticky top-0 z-40 flat no shadows flex justify-between items-center px-margin-mobile h-16">
<div class="flex items-center gap-3">
<button class="text-on-surface-variant active:scale-95 duration-200 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim tracking-tight">Settings</h1>
</div>
</header>
<main class="px-margin-mobile py-6 space-y-section-gap">
<!-- User Profile Card -->
<section class="bg-surface rounded-[16px] p-container-padding shadow-[0_4px_16px_rgba(76,34,189,0.08)] flex items-center gap-4">
<div class="w-16 h-16 rounded-full overflow-hidden flex-shrink-0 border-2 border-primary-container">
<img alt="User Avatar" class="w-full h-full object-cover" data-alt="A close-up, high-quality avatar portrait of a professional individual with a warm, confident expression. The lighting is soft and flattering, highlighting modern features. The background is a vibrant, abstract gradient in shades of deep violet and bright purple, aligning perfectly with a modern, expressive UI aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAbSxrWfPzfy5Kxg_NFmty53EkP60mqHZ9C5JFTL5lwzWsEap9eoiRJyxxS7JCfs596t4TS5XtYrOSvXbSOpoQE-ZgGo9aG1RcVW3N1WyHZqbQaE3yOCtegDvvEwa2_SDTakze1_MEzSlR-i_5XSBg_HZKCDzraGq0gTj0N4KsQZmkVd3JHj1p1VxbAyp_q3nl3n-BCTZNaSS_nMal16R83jRUjrLGH5bip_xb9t2awHR_O2Ab43hRc9g"/>
</div>
<div class="flex-grow">
<h2 class="font-title-lg text-title-lg text-on-surface">Alex Mercer</h2>
<p class="font-body-md text-body-md text-on-surface-variant">alex.mercer@citadel.net</p>
</div>
<button aria-label="Edit Profile" class="bg-primary-container text-on-primary-container rounded-full w-10 h-10 flex items-center justify-center active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="edit" data-weight="fill" style="font-variation-settings: 'FILL' 1;">edit</span>
</button>
</section>
<!-- Settings Groups -->
<div class="space-y-6">
<!-- Account Group -->
<section>
<h3 class="font-label-lg text-label-lg text-primary uppercase tracking-wider mb-2 px-4">Account</h3>
<div class="bg-surface rounded-[16px] overflow-hidden shadow-[0_4px_16px_rgba(76,34,189,0.05)] divide-y divide-surface-container-low">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-highest transition-colors active:bg-surface-variant">
<div class="flex items-center gap-4">
<div class="bg-secondary-container text-on-secondary-container w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Personal Information</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-highest transition-colors active:bg-surface-variant">
<div class="flex items-center gap-4">
<div class="bg-secondary-container text-on-secondary-container w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="shield">shield</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Security &amp; Password</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Appearance Group -->
<section>
<h3 class="font-label-lg text-label-lg text-primary uppercase tracking-wider mb-2 px-4">Appearance</h3>
<div class="bg-surface rounded-[16px] overflow-hidden shadow-[0_4px_16px_rgba(76,34,189,0.05)]">
<div class="w-full flex items-center justify-between p-4">
<div class="flex items-center gap-4">
<div class="bg-secondary-container text-on-secondary-container w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="palette">palette</span>
</div>
<div>
<span class="font-body-lg text-body-lg text-on-surface block text-left">Theme</span>
<span class="font-body-md text-body-md text-on-surface-variant block text-left">Citadel or Realm</span>
</div>
</div>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-14 h-7 bg-surface-variant rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</section>
<!-- Notifications Group -->
<section>
<h3 class="font-label-lg text-label-lg text-primary uppercase tracking-wider mb-2 px-4">Notifications</h3>
<div class="bg-surface rounded-[16px] overflow-hidden shadow-[0_4px_16px_rgba(76,34,189,0.05)] divide-y divide-surface-container-low">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-highest transition-colors active:bg-surface-variant">
<div class="flex items-center gap-4">
<div class="bg-secondary-container text-on-secondary-container w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Push Notifications</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-highest transition-colors active:bg-surface-variant">
<div class="flex items-center gap-4">
<div class="bg-secondary-container text-on-secondary-container w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Email Digests</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Storage Group -->
<section>
<h3 class="font-label-lg text-label-lg text-primary uppercase tracking-wider mb-2 px-4">System</h3>
<div class="bg-surface rounded-[16px] overflow-hidden shadow-[0_4px_16px_rgba(76,34,189,0.05)]">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-highest transition-colors active:bg-surface-variant">
<div class="flex items-center gap-4">
<div class="bg-secondary-container text-on-secondary-container w-10 h-10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="cloud">cloud</span>
</div>
<div class="text-left">
<span class="font-body-lg text-body-lg text-on-surface block">Storage &amp; Data</span>
<span class="font-body-md text-body-md text-on-surface-variant block">12.4 GB used</span>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<div class="pt-6 pb-12 flex justify-center">
<button class="font-label-lg text-label-lg text-error hover:text-on-error-container transition-colors py-2 px-4">
                    Sign Out
                </button>
</div>
</div>
</main>
<!-- BottomNavBar suppressed for Settings screen as it is a transactional/task-focused departure from main flow -->
</body></html>
