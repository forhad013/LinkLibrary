<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lords of Links - Add Link</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {

                        "on-primary-fixed": "#1e0061",
                        "surface-tint": "#6341d5",
                        "outline-variant": "#cac4d7",
                        "surface-dim": "#dcd9da",
                        "tertiary-fixed": "#e8e0e6",
                        "background": "#fcf8f9",
                        "inverse-on-surface": "#f3f0f1",
                        "inverse-surface": "#303031",
                        "tertiary-container": "#625e63",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#dfd8de",
                        "primary": "#4c22bd",
                        "secondary-fixed": "#e7deff",
                        "on-secondary-fixed-variant": "#4b2ea6",
                        "surface-container-high": "#eae7e8",
                        "tertiary": "#4a464b",
                        "surface-container-low": "#f6f3f4",
                        "inverse-primary": "#cbbeff",
                        "on-surface-variant": "#484554",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#340d90",
                        "on-primary-container": "#ded4ff",
                        "surface-bright": "#fcf8f9",
                        "secondary-fixed-dim": "#ccbeff",
                        "error": "#BA1A1A",
                        "tertiary-fixed-dim": "#cbc4ca",
                        "outline": "#797586",
                        "on-tertiary-fixed-variant": "#49454a",
                        "secondary": "#6349bf",
                        "on-error": "#ffffff",
                        "on-surface": "#1b1b1c",
                        "on-secondary-fixed": "#1e0060",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#1d1b1f",
                        "secondary-container": "#9f86ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1rem",
                        "3xl": "1.5rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-desktop": "24px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "section-gap": "48px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Be Vietnam Pro"],
                        "label-lg": ["Be Vietnam Pro"],

                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],

                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "700" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Transactional Screen - No Global Nav Shells Rendered -->
<main class="w-full max-w-lg mx-auto">
<!-- Add Link Card Form -->
<div class="glass-card rounded-3xl p-6 sm:p-8 shadow-[0_8px_32px_rgba(76,34,189,0.12)] relative overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container rounded-full blur-2xl opacity-50 pointer-events-none"></div>
<div class="absolute -bottom-10 -left-10 w-40 h-40 bg-secondary-container rounded-full blur-2xl opacity-40 pointer-events-none"></div>
<header class="flex items-center justify-between mb-8 relative z-10">
<div>
<h1 class="font-headline-md text-headline-md text-primary">Capture Link</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Add a new resource to your Citadel.</p>
</div>
<button aria-label="Close" class="p-2 rounded-full hover:bg-surface-variant/50 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<form class="space-y-6 relative z-10">
<!-- URL Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-2" for="url">URL</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="link">link</span>
<input class="w-full bg-surface pl-12 pr-4 py-3 rounded-xl border-2 border-outline-variant focus:border-secondary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline" id="url" name="url" placeholder="https://" required="" type="url"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-secondary hover:bg-secondary-container/30 transition-colors" title="Auto-parse" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="auto_awesome">auto_awesome</span>
</button>
</div>
</div>
<!-- Title Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-2" for="title">Title</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="title">title</span>
<input class="w-full bg-surface pl-12 pr-4 py-3 rounded-xl border-2 border-outline-variant focus:border-secondary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline" id="title" name="title" placeholder="Descriptive title" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<!-- Collection Selection -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-2">Collection</label>
<div class="relative">
<select class="w-full bg-surface pl-10 pr-10 py-3 rounded-xl border-2 border-outline-variant focus:border-secondary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface appearance-none cursor-pointer">
<option disabled="" selected="" value="">Select...</option>
<option value="design">Design Inspiration</option>
<option value="dev">Dev Resources</option>
<option value="read">Read Later</option>
</select>
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none" data-icon="folder">folder</span>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<!-- Assign Task -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-2">Assign Task</label>
<div class="relative">
<select class="w-full bg-surface pl-10 pr-10 py-3 rounded-xl border-2 border-outline-variant focus:border-secondary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface appearance-none cursor-pointer">
<option value="none">None</option>
<option value="review">Review by Friday</option>
<option value="implement">Implement in Project X</option>
</select>
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none" data-icon="assignment">assignment</span>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Action Button -->
<div class="pt-6 mt-6 border-t border-surface-variant">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-full shadow-[0_4px_12px_rgba(76,34,189,0.2)] hover:shadow-[0_6px_16px_rgba(76,34,189,0.3)] hover:-translate-y-0.5 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
                        Capture Link
                    </button>
</div>
</form>
</div>
</main>
</body></html>
