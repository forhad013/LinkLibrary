<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lords of Links - Add Link</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#FEFBFF",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#cbbeff",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#f0edee",
                        "on-primary-fixed-variant": "#4b21bd",
                        "primary-container": "#EADDFF",
                        "surface-container-highest": "#e5e2e3",
                        "primary-fixed": "#e7deff",
                        "on-background": "#1b1b1c",
                        "surface-variant": "#e5e2e3",
                        "on-primary-fixed": "#1e0061",
                        "surface-tint": "#6341d5",
                        "outline-variant": "#cac4d7",
                        "surface-dim": "#dcd9da",
                        "tertiary-fixed": "#e8e0e6",
                        "background": "#fcf8f9",
                        "inverse-on-surface": "#f3f0f1",
                        "inverse-surface": "#303031",
                        "tertiary-container": "#625e63",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#dfd8de",
                        "primary": "#4c22bd",
                        "secondary-fixed": "#e7deff",
                        "on-secondary-fixed-variant": "#4b2ea6",
                        "surface-container-high": "#eae7e8",
                        "tertiary": "#4a464b",
                        "surface-container-low": "#f6f3f4",
                        "inverse-primary": "#cbbeff",
                        "on-surface-variant": "#484554",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#340d90",
                        "on-primary-container": "#ded4ff",
                        "surface-bright": "#fcf8f9",
                        "secondary-fixed-dim": "#ccbeff",
                        "error": "#BA1A1A",
                        "tertiary-fixed-dim": "#cbc4ca",
                        "outline": "#797586",
                        "on-tertiary-fixed-variant": "#49454a",
                        "secondary": "#6349bf",
                        "on-error": "#ffffff",
                        "on-surface": "#1b1b1c",
                        "on-secondary-fixed": "#1e0060",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#1d1b1f",
                        "secondary-container": "#9f86ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1rem",
                        "3xl": "1.5rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-desktop": "24px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "section-gap": "48px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Be Vietnam Pro"],
                        "label-lg": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "title-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "700" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- App Bar -->
<header class="flex items-center justify-between p-4 sticky top-0 bg-background z-20">
<button aria-label="Close" class="p-2 rounded-full hover:bg-surface-variant/50 transition-colors text-on-surface">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary">Add New Link</h1>
<button class="bg-surface-variant text-on-surface-variant font-label-lg text-label-lg px-4 py-2 rounded-full hover:bg-outline-variant transition-colors" type="button">
    Save
  </button>
</header>
<main class="flex-1 w-full max-w-lg mx-auto p-4 pb-24 overflow-y-auto">
<form class="space-y-6">
<!-- URL Input with Auto-fetch -->
<div>
<div class="flex gap-2 items-start">
<div class="relative flex-1">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="link">link</span>
<input class="w-full bg-surface-container-low pl-12 pr-4 py-3 rounded-2xl border border-outline-variant focus:border-secondary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline" id="url" name="url" placeholder="https://example.com" required="" type="url"/>
</div>
<button class="bg-surface-container-highest text-on-surface font-label-lg text-label-lg px-4 py-3 rounded-2xl hover:bg-outline-variant transition-colors flex items-center gap-2 whitespace-nowrap h-[48px]" type="button">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="auto_awesome">auto_awesome</span>
    Auto-fetch
  </button>
</div>
<p class="font-body-md text-[12px] text-on-surface-variant mt-2 px-1">Paste a URL to automatically fetch title and description.</p>
</div>
<hr class="border-outline-variant"/>
<!-- Title Field -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-2" for="title">Title</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="title">title</span>
<input class="w-full bg-surface-container-low pl-12 pr-4 py-3 rounded-2xl border border-outline-variant focus:border-secondary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline" id="title" name="title" placeholder="Enter link title" type="text"/>
</div>
</div>
<!-- Organization Section -->
<div class="bg-surface rounded-3xl p-6 border border-outline-variant shadow-sm space-y-6">
<h2 class="font-title-lg text-[18px] text-on-surface font-semibold">Organization</h2>
<!-- Collection Selection -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Collection</label>
<div class="flex gap-2">
<div class="relative flex-1">
<select class="w-full bg-surface-container-low pl-4 pr-10 py-3 rounded-2xl border border-outline-variant focus:border-secondary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface-variant appearance-none cursor-pointer">
<option disabled="" selected="" value="">Select collections</option>
<option value="design">Design Inspiration</option>
<option value="dev">Dev Resources</option>
<option value="read">Read Later</option>
</select>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
<button class="bg-primary/60 text-on-primary w-12 h-12 rounded-xl flex items-center justify-center hover:bg-primary transition-colors flex-shrink-0" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Tags Section -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Tags</label>
<div class="flex flex-wrap gap-2 items-center">
<span class="px-4 py-2 rounded-xl border border-outline-variant text-on-surface font-label-md bg-surface">Test</span>
<span class="px-4 py-2 rounded-xl border border-outline-variant text-on-surface font-label-md bg-surface">test1</span>
<span class="px-4 py-2 rounded-xl border border-outline-variant text-on-surface font-label-md bg-surface">vvc</span>
<button class="w-8 h-8 rounded-full flex items-center justify-center text-primary hover:bg-primary-container transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
</div>
<!-- Personal Notes -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-2" for="notes">Personal Notes</label>
<textarea class="w-full bg-surface-container-low p-4 rounded-2xl border border-outline-variant focus:border-secondary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline resize-none min-h-[120px]" id="notes" name="notes" placeholder="Add any personal notes, reminders, or context here..."></textarea>
</div>
<!-- Add to Tasks Section -->
<div class="bg-surface rounded-3xl p-6 border border-outline-variant shadow-sm space-y-6 mb-6">
<div class="flex items-center justify-between">
<h2 class="font-title-lg text-[18px] text-on-surface font-semibold">Add to Tasks</h2>
<div class="flex items-center gap-3">
<span class="font-label-lg text-on-surface-variant">Mark as Task</span>
<button aria-checked="true" class="w-12 h-7 bg-primary rounded-full relative transition-colors focus:outline-none" role="switch" type="button">
<span class="absolute right-1 top-1 w-5 h-5 bg-on-primary rounded-full transition-transform"></span>
</button>
</div>
</div>
<!-- Priority -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Priority</label>
<div class="flex gap-2">
<button class="flex-1 py-3 rounded-2xl border border-outline-variant text-on-surface font-label-lg bg-surface hover:bg-surface-variant transition-colors" type="button">Low</button>
<button class="flex-1 py-3 rounded-2xl bg-primary/60 text-on-primary font-label-lg hover:bg-primary transition-colors" type="button">Medium</button>
<button class="flex-1 py-3 rounded-2xl border border-outline-variant text-on-surface font-label-lg bg-surface hover:bg-surface-variant transition-colors" type="button">High</button>
</div>
</div>
<!-- Due Time -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2">Due Time</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-primary" data-icon="schedule">schedule</span>
<input class="w-full bg-surface-container-low pl-12 pr-4 py-3 rounded-2xl border border-outline-variant focus:border-secondary focus:ring-0 transition-colors font-body-md text-body-md text-on-surface" type="time" value="09:00"/>
</div>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background border-t border-outline-variant z-20 flex justify-center">
<div class="w-full max-w-lg mx-auto">
<button class="w-full bg-primary text-on-primary font-title-lg py-4 rounded-full shadow-[0_4px_12px_rgba(76,34,189,0.2)] hover:shadow-[0_6px_16px_rgba(76,34,189,0.3)] hover:-translate-y-0.5 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
        Capture Link
        </button>
</div>
</div>
</body></html>
