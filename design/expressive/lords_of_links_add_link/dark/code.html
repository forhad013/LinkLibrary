            color: theme('colors.on-background');

        }
        
        .squircle {
            border-radius: 24px;
        }

            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;

            background: theme('colors.surface-variant');
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.outline');

<body class="bg-background min-h-screen pb-32">
<!-- TopAppBar (Transactional - Hidden or Simplified) -->
<!-- Suppressing full nav shell for a capture screen as it's transactional, 
         providing a simple header with a back/close action instead. -->
<header class="w-full top-0 sticky bg-background z-40 flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full">
<button class="text-on-surface-variant hover:text-primary transition-colors p-2 -ml-2 rounded-full active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-background tracking-tight">Capture Link</h1>
<button class="text-primary hover:text-primary-container font-label-lg text-label-lg transition-colors p-2 -mr-2 active:scale-95 transition-transform duration-200">
            Save
        </button>
</header>
<main class="max-w-3xl mx-auto px-margin-mobile md:px-margin-desktop mt-4 space-y-section-gap">
<!-- URL & Metadata Section (Glassmorphism / Tonal Stacking) -->
<section class="space-y-6">
<div class="bg-surface-container squircle p-container-padding flex flex-col md:flex-row gap-6 shadow-glow relative overflow-hidden group transition-all duration-300 focus-within:ring-1 focus-within:ring-primary focus-within:shadow-glow-lg">
<!-- Decorative glow accent -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container rounded-full blur-3xl opacity-20 group-focus-within:opacity-40 transition-opacity"></div>
<div class="flex-shrink-0 w-full md:w-32 h-32 bg-surface-container-high rounded-xl flex items-center justify-center overflow-hidden border border-surface-variant">
<span class="material-symbols-outlined text-4xl text-on-surface-variant" data-icon="link">link</span>
<!-- Optional: If URL resolves to image, it goes here. Placeholder for layout visualization. -->
<img class="absolute inset-0 w-full h-full object-cover opacity-50 mix-blend-overlay" data-alt="A dark, moody abstract 3D render representing digital connectivity. Glowing violet lines connecting nodes in a deep charcoal void, representing the 'Lords of Links' atmospheric dark theme." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0_W3Zr5aWfqyJ40DhxGh8RBj_eUZcbbR62G_ryy33j8hY97Glbk29sn3HwWlzXFgInGAfEror9yXzNMCH2miZ8YGBdYm2gyjugd5Wao7UUAQNgSq9joVzVsrb82r-knpsvMc9lEQr_RB9xYMWfwquJxd6RdZ3DQ3ks5Bi-T1fyjumb_5gi_ws8sdZ__vcGZ-qKZtitpa7TVaStdsguhYNIwUBvZ222IDQZ7gEc1kSHK2MGRRTP7uopA"/>
</div>
<div class="flex-grow space-y-4 relative z-10">
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="url-input">URL</label>
<div class="flex items-center bg-surface-container-high rounded-lg border border-transparent focus-within:border-secondary transition-colors px-3 py-2">
<span class="material-symbols-outlined text-on-surface-variant mr-2" data-icon="public" data-weight="fill" style="font-variation-settings: 'FILL' 1;">public</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md placeholder-on-surface-muted p-0" id="url-input" placeholder="https://example.com/article" type="url" value="https://designsystem.brand.com/tokens"/>
</div>
</div>
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="title-input">Title</label>
<input class="w-full bg-surface-container-high rounded-lg border-transparent focus:border-secondary focus:ring-0 text-on-surface font-title-lg text-title-lg placeholder-on-surface-muted px-4 py-2 transition-colors" id="title-input" placeholder="Link Title" type="text" value="Design System Visual Tokens"/>
</div>
</div>
</div>
</section>
<!-- Organization (Collections & Tags) -->
<section class="space-y-4">
<h2 class="font-title-lg text-title-lg text-on-background">Organization</h2>
<div class="bg-surface-container squircle p-container-padding space-y-6">
<!-- Collection Selector -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant">Collection</label>
<div class="relative">
<select class="w-full bg-surface-container-high rounded-lg border-transparent focus:border-secondary focus:ring-0 text-on-surface font-body-md py-3 pl-4 pr-10 appearance-none transition-colors">
<option>Work Projects</option>
<option>Inspiration</option>
<option selected="">Design Resources</option>
<option>Reading List</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Tags (Pills) -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant">Tags</label>
<div class="flex flex-wrap gap-2">
<!-- Selected Tag -->
<button class="inline-flex items-center bg-primary-container text-on-primary-container font-label-lg text-label-lg px-4 py-2 rounded-full border border-primary transition-all active:scale-95 shadow-[0_0_12px_rgba(100,66,214,0.3)]">
<span class="material-symbols-outlined text-[18px] mr-1" data-icon="check" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
                            UI/UX
                        </button>
<!-- Unselected Tags -->
<button class="inline-flex items-center bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg px-4 py-2 rounded-full hover:bg-surface-variant transition-colors active:scale-95">
                            Tokens
                        </button>
<button class="inline-flex items-center bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg px-4 py-2 rounded-full hover:bg-surface-variant transition-colors active:scale-95">
                            Reference
                        </button>
<!-- Add New Tag -->
<button class="inline-flex items-center border border-dashed border-outline text-on-surface-variant font-label-lg text-label-lg px-4 py-2 rounded-full hover:border-primary hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-[18px] mr-1" data-icon="add">add</span>
                            New Tag
                        </button>
</div>
</div>
</div>
</section>
<!-- Context & Tasks Bento Layout -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Notes -->
<div class="bg-surface-container squircle p-container-padding flex flex-col h-full">
<div class="flex items-center gap-2 mb-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="description">description</span>
<h2 class="font-title-lg text-title-lg text-on-background">Notes</h2>
</div>
<textarea class="flex-grow w-full bg-surface-container-high rounded-xl border-transparent focus:border-secondary focus:ring-0 text-on-surface font-body-md placeholder-on-surface-muted p-4 resize-none min-h-[120px] transition-colors" placeholder="Why are you saving this link? Add personal thoughts or highlights here..."></textarea>
</div>
<!-- Task Integration -->
<div class="bg-surface-container squircle p-container-padding flex flex-col h-full">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<h2 class="font-title-lg text-title-lg text-on-background">Task</h2>
</div>
<!-- Toggle Switch (Vanilla CSS/HTML) -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-on-surface after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
<div class="space-y-4 flex-grow">
<!-- Priority -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant">Priority</label>
<div class="flex gap-2">
<button class="flex-1 bg-surface-container-highest text-on-surface-variant hover:bg-surface-variant font-label-md text-label-md py-2 rounded-lg transition-colors">Low</button>
<button class="flex-1 bg-primary-container text-on-primary-container border border-primary font-label-md text-label-md py-2 rounded-lg transition-colors shadow-[inset_0_0_0_1px_theme('colors.primary')]">Medium</button>
<button class="flex-1 bg-surface-container-highest text-on-surface-variant hover:bg-surface-variant font-label-md text-label-md py-2 rounded-lg transition-colors">High</button>
</div>
</div>
<!-- Due Date -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant">Due Date</label>
<div class="flex items-center bg-surface-container-high rounded-lg px-3 py-2 border border-transparent focus-within:border-secondary transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-2" data-icon="calendar_today">calendar_today</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md p-0" type="date" value="2023-11-15"/>
</div>
</div>
</div>
</div>
</section>
<!-- Primary Action Button (Mobile optimization) -->
<div class="pt-4 pb-8 md:hidden">
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-4 rounded-full active:scale-95 transition-transform duration-200 shadow-glow flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="bookmark" data-weight="fill" style="font-variation-settings: 'FILL' 1;">bookmark</span>
                Save Link
            </button>
</div>
</main>
<!-- FAB (Desktop optimization - floating save action) -->
<div class="hidden md:block fixed bottom-8 right-8 z-50">
<button class="bg-primary text-on-primary w-16 h-16 rounded-2xl flex items-center justify-center shadow-glow hover:shadow-glow-lg hover:-translate-y-1 active:scale-95 transition-all duration-200 group">
<span class="material-symbols-outlined text-3xl group-hover:scale-110 transition-transform" data-icon="save" data-weight="fill" style="font-variation-settings: 'FILL' 1;">save</span>
</button>
</div>
</body></html>
