name: Set up build
description: JDK and Gradle (with its cache) for the CI jobs; run after actions/checkout

runs:
  using: composite
  steps:
    # 21, not 17: the Android app compiles with Java 21 (compileOptions in app/androidApp)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
