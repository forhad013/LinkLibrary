name: CI Check

# Runs on every pull request: does it compile, do the tests pass.
# detekt, Android Lint and the unit tests each post one summary comment on the PR (updated each run) and fail the check.
# Coverage and detekt reports are uploaded as artifacts.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Compile & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # detekt, lint and unit test summary comments
      checks: write # per-test report from dorny/test-reporter
    env:
      # Shown in the PR comments when everything passes; swap in any GIF URL you like
      DETEKT_PASS_GIF: https://media.giphy.com/media/111ebonMs90YLu/giphy.gif
      TESTS_PASS_GIF: https://media.giphy.com/media/111ebonMs90YLu/giphy.gif
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 21, not 17: the Android app compiles with Java 21 (compileOptions in app/androidApp)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Findings not in detekt-baseline.xml make this fail; the job carries on so the PR gets the
      # comment and the tests still run, then "Fail on detekt findings" at the end fails the check
      - name: Static analysis (detekt)
        id: detekt
        continue-on-error: true
        run: ./gradlew detekt

      - name: Write detekt comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if [ "${{ steps.detekt.outcome }}" = "success" ]; then
            printf '## detekt ✅\n\nNo new findings. Clean code, nice work!\n\n![All clear](%s)\n' "$DETEKT_PASS_GIF" > detekt-comment.md
          else
            {
              echo '## detekt ❌'
              echo
              echo 'New findings below block the merge. Fix them and push; this comment updates itself.'
              echo 'Findings that existed before are listed in `detekt-baseline.xml`.'
              echo
              sed -n '/^## Issues/,$p' build/reports/detekt/detekt.md 2>/dev/null | grep . >/dev/null \
                && sed -n '/^## Issues/,$p' build/reports/detekt/detekt.md \
                || echo 'detekt failed before writing a report; see the "Static analysis (detekt)" step log.'
            } > detekt-comment.md
          fi

      # One comment per PR, edited on every run instead of adding new ones
      - name: Post detekt comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # PRs from forks get a read-only token and can't comment; the check result still counts
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: detekt
          path: detekt-comment.md

      - name: Upload detekt report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt
          retention-days: 14
          if-no-files-found: ignore

      # Errors fail, warnings are only listed. Library modules are linted one by one because the app's
      # checkDependencies crashes lint on AGP 9. Same pattern as detekt: "Fail on lint errors" fails the check
      - name: Android Lint
        id: lint
        continue-on-error: true
        run: >-
          ./gradlew --continue :app:androidApp:lintDebug :app:lintAndroidMain :bookmarks:lintAndroidMain
          :core:design:lintAndroidMain :core:utils:lintAndroidMain

      - name: Write lint comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          python3 .github/scripts/lint_summary.py . $(find . -path '*/build/reports/lint-results-*.xml') > lint-comment.md
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            printf '\n❌ Lint errors block the merge. Fix them and push; this comment updates itself.\n' >> lint-comment.md
          fi

      - name: Post lint comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: android-lint
          path: lint-comment.md

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: '*/**/build/reports/lint-results-*.html'
          retention-days: 14
          if-no-files-found: ignore

      # Same pattern as detekt: carry on so the PR gets the comment, "Fail on test failures" fails the check
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :app:jvmTest :bookmarks:jvmTest :database:jvmTest --continue

      # Full report: a "Unit test results" check on the PR with every test, passed and failed, grouped by class
      - name: Unit test report
        id: test-report
        if: ${{ !cancelled() }}
        # PRs from forks get a read-only token and can't create checks; the test result still counts
        continue-on-error: true
        uses: dorny/test-reporter@v2
        with:
          name: Unit test results
          path: '*/build/test-results/**/TEST-*.xml'
          reporter: java-junit
          list-suites: all
          list-tests: all
          fail-on-error: false # "Fail on test failures" below decides

      - name: Write unit test comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          TEST_REPORT_URL: ${{ steps.test-report.outputs.url_html }}
        run: python3 .github/scripts/test_summary.py app/build/test-results bookmarks/build/test-results database/build/test-results > test-comment.md

      - name: Post unit test comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: unit-tests
          path: test-comment.md

      - name: Upload test report
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            */build/reports/tests
            */build/test-results
          retention-days: 14
          if-no-files-found: ignore

      # Reuses the test results above; merged report for app, bookmarks and database.
      # Skipped when tests fail: Kover would re-run them and fail the same way
      - name: Coverage report
        if: ${{ steps.tests.outcome == 'success' }}
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Upload coverage report
        if: ${{ steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/reports/kover/html
            build/reports/kover/report.xml
          retention-days: 14
          if-no-files-found: error

      # Debug only: no signing secrets needed, so it also works on PRs from forks
      - name: Compile Android and desktop
        run: ./gradlew :app:androidApp:assembleDebug :app:desktopApp:compileKotlinJvm

      # Last, so the tests and builds above still report; these are what block the merge
      - name: Fail on test failures
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        run: |
          echo "Unit tests failed; see the PR comment or the test-report artifact."
          exit 1

      - name: Fail on lint errors
        if: ${{ !cancelled() && steps.lint.outcome == 'failure' }}
        run: |
          echo "Android Lint found errors; see the PR comment or the lint-report artifact."
          exit 1

      - name: Fail on detekt findings
        if: ${{ !cancelled() && steps.detekt.outcome == 'failure' }}
        run: |
          echo "detekt found new issues; see the PR comment or the detekt-report artifact."
          exit 1
