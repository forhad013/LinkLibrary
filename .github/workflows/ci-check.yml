name: CI Check

# Runs on every pull request: does it compile, do the tests pass.
# detekt posts one summary comment on the PR (updated each run) and fails the check on new findings.
# Coverage and detekt reports are uploaded as artifacts.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Compile & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # detekt summary comment
    env:
      # Shown in the PR comment when detekt finds nothing new; swap in any GIF URL you like
      DETEKT_PASS_GIF: https://media.giphy.com/media/111ebonMs90YLu/giphy.gif
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 21, not 17: the Android app compiles with Java 21 (compileOptions in app/androidApp)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Findings not in detekt-baseline.xml make this fail; the job carries on so the PR gets the
      # comment and the tests still run, then "Fail on detekt findings" at the end fails the check
      - name: Static analysis (detekt)
        id: detekt
        continue-on-error: true
        run: ./gradlew detekt

      - name: Write detekt comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if [ "${{ steps.detekt.outcome }}" = "success" ]; then
            printf '## detekt ✅\n\nNo new findings. Clean code, nice work!\n\n![All clear](%s)\n' "$DETEKT_PASS_GIF" > detekt-comment.md
          else
            {
              echo '## detekt ❌'
              echo
              echo 'New findings below block the merge. Fix them and push; this comment updates itself.'
              echo 'Findings that existed before are listed in `detekt-baseline.xml`.'
              echo
              sed -n '/^## Issues/,$p' build/reports/detekt/detekt.md 2>/dev/null | grep . >/dev/null \
                && sed -n '/^## Issues/,$p' build/reports/detekt/detekt.md \
                || echo 'detekt failed before writing a report; see the "Static analysis (detekt)" step log.'
            } > detekt-comment.md
          fi

      # One comment per PR, edited on every run instead of adding new ones
      - name: Post detekt comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # PRs from forks get a read-only token and can't comment; the check result still counts
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: detekt
          path: detekt-comment.md

      - name: Upload detekt report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt
          retention-days: 14
          if-no-files-found: ignore

      - name: Unit tests
        run: ./gradlew :app:jvmTest :bookmarks:jvmTest :database:jvmTest

      # Reuses the test results above; merged report for app, bookmarks and database
      - name: Coverage report
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/reports/kover/html
            build/reports/kover/report.xml
          retention-days: 14
          if-no-files-found: error

      # Debug only: no signing secrets needed, so it also works on PRs from forks
      - name: Compile Android and desktop
        run: ./gradlew :app:androidApp:assembleDebug :app:desktopApp:compileKotlinJvm

      # Last, so the tests and builds above still report; this is what blocks the merge
      - name: Fail on detekt findings
        if: ${{ !cancelled() && steps.detekt.outcome == 'failure' }}
        run: |
          echo "detekt found new issues; see the PR comment or the detekt-report artifact."
          exit 1
