name: CI Check

# Runs on every pull request: does it compile, do the tests pass.
# Coverage report is uploaded as an artifact; lint and static analysis come later.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Compile & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 21, not 17: the Android app compiles with Java 21 (compileOptions in app/androidApp)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:jvmTest :bookmarks:jvmTest :database:jvmTest

      # Reuses the test results above; merged report for app, bookmarks and database
      - name: Coverage report
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/reports/kover/html
            build/reports/kover/report.xml
          retention-days: 14
          if-no-files-found: error

      # Debug only: no signing secrets needed, so it also works on PRs from forks
      - name: Compile Android and desktop
        run: ./gradlew :app:androidApp:assembleDebug :app:desktopApp:compileKotlinJvm
