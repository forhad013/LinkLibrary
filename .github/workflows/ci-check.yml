name: CI Check

# Runs on every pull request: does it compile, do the tests pass.
# detekt findings annotate the PR; coverage and detekt reports are uploaded as artifacts.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Compile & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # detekt findings as inline PR annotations (code scanning)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 21, not 17: the Android app compiles with Java 21 (compileOptions in app/androidApp)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fails on findings not in detekt-baseline.xml; the steps below still upload the report
      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Annotate PR with detekt findings
        if: ${{ !cancelled() }}
        # Needs GitHub code scanning (public repo or Advanced Security); fork PRs can't write it either
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

      - name: Upload detekt report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt
          retention-days: 14
          if-no-files-found: ignore

      - name: Unit tests
        run: ./gradlew :app:jvmTest :bookmarks:jvmTest :database:jvmTest

      # Reuses the test results above; merged report for app, bookmarks and database
      - name: Coverage report
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/reports/kover/html
            build/reports/kover/report.xml
          retention-days: 14
          if-no-files-found: error

      # Debug only: no signing secrets needed, so it also works on PRs from forks
      - name: Compile Android and desktop
        run: ./gradlew :app:androidApp:assembleDebug :app:desktopApp:compileKotlinJvm
