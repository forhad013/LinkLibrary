name: Android Release

# Builds automatically on every push to main.
# Publishing to Play Store is a SEPARATE job gated behind a GitHub
# Environment approval — this is the "lock" the build sits in until
# someone manually promotes it. Configure this in:
# Repo Settings -> Environments -> New environment -> "production"
#   -> check "Required reviewers" -> add yourself / release manager(s)

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you re-trigger a publish manually if needed

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build signed AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/androidApp/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish to Play Store (locked until approved)
    needs: build
    runs-on: ubuntu-latest
    # This line is the actual lock. GitHub will not run any step below
    # until a required reviewer on the "production" environment approves it
    # from the Actions run page.
    environment: production
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: ./artifacts

      - name: Publish to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.yourorg.lordsoflinks   # <-- update to your applicationId
          releaseFiles: artifacts/*.aab
          track: production                       # or 'internal' / 'beta' while testing
          status: completed